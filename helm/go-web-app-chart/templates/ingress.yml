apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-web-ingress
  labels:
    app.kubernetes.io/name: go-web-ingress
spec:
  ingressClassName: nginx  # identified by ingress controler

  rules:
  - host: go-web-app.local
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: go-web-service
            port: 
              number: 80
