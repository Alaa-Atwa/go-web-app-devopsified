name: build--test the go-web-app

on:
  push:
    branches:
      - "main"
    paths-ignore: -'helm/**'
      -'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go version 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: build
        run: go build -o go-web-app

      - name: test
        run: go test ./..

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: use golangci-lint
        uses: golangci/golangci-lint-action@v4
        # form github actions marketplace
        with:
          version: v1.56.2
  #########################################################
  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: setup docker buildx
        uses: docker/setup-buildx-actions@v1

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push action
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{github.run_id}}

  #######################################################
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update tag in Helm chart
        run: |
          sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/go-web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "alaa.atwa555@gmail.com"
          git config --global user.name "Alaa Atwa"
          git add helm/go-web-app-chart/values.yaml
          git commit -m "Update tag in Helm chart"
          git push
